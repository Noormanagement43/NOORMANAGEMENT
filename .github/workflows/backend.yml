name: NOOR backend checks
on:
  push:
    branches: [main, feat/noor-backend-gateway-20261104]
    paths: ['supabase/functions/noor-backend-api/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['supabase/functions/noor-backend-api/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci --ignore-scripts --prefix supabase/functions/noor-backend-api
      - run: deno check --node-modules-dir=manual supabase/functions/noor-backend-api/index.ts
      - run: deno test --allow-env --node-modules-dir=manual supabase/functions/noor-backend-api/index_test.ts
