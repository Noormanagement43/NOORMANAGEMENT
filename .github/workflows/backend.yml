name: NOOR backend checks
on:
  push:
    branches: [main, feat/noor-backend-gateway-20261104, feat/noor-ai-provider-wiring-20261104]
    paths: ['supabase/functions/noor-backend-api/**', 'supabase/functions/noor-v2-ai/**', 'supabase/functions/noor-test-grader/**', 'supabase/functions/noor-communications-api/**', 'supabase/functions/noor-email-worker/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['supabase/functions/noor-backend-api/**', 'supabase/functions/noor-v2-ai/**', 'supabase/functions/noor-test-grader/**', 'supabase/functions/noor-communications-api/**', 'supabase/functions/noor-email-worker/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm ci --ignore-scripts --prefix supabase/functions/noor-backend-api
      - run: deno check --node-modules-dir=manual supabase/functions/noor-backend-api/index.ts
      - run: deno test --allow-env --node-modules-dir=manual supabase/functions/noor-backend-api/index_test.ts supabase/functions/noor-backend-api/brevo_mcp_test.ts

      - run: npm ci --ignore-scripts --prefix supabase/functions/noor-v2-ai
      - run: deno check --node-modules-dir=manual supabase/functions/noor-v2-ai/index.ts
      - run: deno test --allow-env --node-modules-dir=manual supabase/functions/noor-v2-ai/providers_test.ts

      - run: npm ci --ignore-scripts --prefix supabase/functions/noor-test-grader
      - run: deno check --node-modules-dir=manual supabase/functions/noor-test-grader/index.ts
      - run: deno test --allow-env --node-modules-dir=manual supabase/functions/noor-test-grader/index_test.ts

      - name: Check school communications API
        run: deno check --node-modules-dir=auto supabase/functions/noor-communications-api/index.ts
      - name: Test school email dispatch authorization
        run: deno test --allow-env --node-modules-dir=auto supabase/functions/noor-communications-api/index_test.ts
      - name: Check scheduled email worker
        run: deno check --node-modules-dir=auto supabase/functions/noor-email-worker/index.ts
      - name: Test email worker token
        run: deno test --allow-env --node-modules-dir=auto supabase/functions/noor-email-worker/index_test.ts
