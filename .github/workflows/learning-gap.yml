name: NOOR Learning Intelligence quality gates
on:
  pull_request:
    paths:
      - 'supabase/functions/noor-learning-ai/**'
      - 'supabase/migrations/*learning_gap_time_machine*.sql'
      - 'noor-learning-gap-time-machine.*'
      - 'tests/noor-learning-gap-time-machine.test.mjs'
      - '.github/workflows/learning-gap.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/noor-learning-ai/**'
      - 'supabase/migrations/*learning_gap_time_machine*.sql'
      - 'noor-learning-gap-time-machine.*'
      - 'tests/noor-learning-gap-time-machine.test.mjs'
      - '.github/workflows/learning-gap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Static learning gap UI/schema safety
        run: node --test tests/noor-learning-gap-time-machine.test.mjs
      - name: Typecheck privacy-focused AI gateway
        run: deno check --node-modules-dir=auto supabase/functions/noor-learning-ai/index.ts
      - name: Reject untrusted AI output and insufficient evidence
        run: deno test --allow-env --node-modules-dir=auto supabase/functions/noor-learning-ai/index_test.ts
