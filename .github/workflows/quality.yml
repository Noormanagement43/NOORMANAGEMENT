name: NOOR static quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run static regression tests
        run: node --test tests/*.test.mjs
      - name: Install UI test dependencies
        run: npm ci --ignore-scripts --prefix tests/ui
      - name: Verify marks, notes and delete interactions
        run: npm test --prefix tests/ui
